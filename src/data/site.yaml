# Site-wide settings. Edit this file to update contact info, recruiting dates,
# and the "Now building" block on the home page. No code changes needed.

name: Orbital Launch Vehicle Team
shortName: OLVT
university: Virginia Tech
email: olvt@vt.edu
founded: 2016

# Shown on the home page under "Now building". `vehicle` must match a file
# in src/content/vehicles/ (without .md).
currentProgram:
  vehicle: hokie-0-75
  status: In development
  # One or two sentences on where the program stands right now. REVIEW R4.
  update: >-
    Hokie 0.75 is the team's space shot: a two-stage sounding rocket designed
    to carry a 5 kg payload past the Kármán line. Skipper 1, Skipper 2 and
    Test Turkey each tested pieces of it in flight.

# Recruiting. The Join page opens and closes the application automatically
